# dev: platform values. PLACEHOLDER IDs (match infra/src/config.ts).
logging:
  region: ap-southeast-2
  logGroupName: /aws/eks/app-dev/containers
aws-load-balancer-controller:
  clusterName: app-dev
  region: ap-southeast-2 # Fargate has no IMDS: region and VPC must be explicit
