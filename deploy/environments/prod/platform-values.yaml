# prod: platform values. PLACEHOLDER IDs (match infra/src/config.ts).
logging:
  region: ap-southeast-2
  logGroupName: /aws/eks/app-prod/containers
aws-load-balancer-controller:
  clusterName: app-prod
  region: ap-southeast-2 # Fargate has no IMDS: region and VPC must be explicit
  vpcId: vpc-0prod0000000000
  replicaCount: 2
  serviceAccount:
    name: aws-load-balancer-controller
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::444444444444:role/app-prod-aws-load-balancer-controller
