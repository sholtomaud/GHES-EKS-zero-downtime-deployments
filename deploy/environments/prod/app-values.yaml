# prod: values for the customer chart (the subchart is called "app"). The same
# documented interface customers use: profile + AWS adapter [ENV-01].
# Keys are illustrative until the chart's values.schema.json exists (slice 1).
app:
  profile: standard
  global:
    registry: 111111111111.dkr.ecr.ap-southeast-2.amazonaws.com/internal
  adapters:
    aws:
      enabled: true
      ingress:
        className: alb
        groupName: app-prod # one shared ALB per environment
        certificateArn: arn:aws:acm:ap-southeast-2:444444444444:certificate/PLACEHOLDER
        readinessGates: true # [ZDT-07]
