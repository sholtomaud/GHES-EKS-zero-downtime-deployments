# App-of-apps on the delivery hub. Applied once, by hand, from a GHES runner in
# the tooling VPC (the hub's API endpoint is private):
#   kubectl --context delivery-hub apply -f bootstrap/root.yaml
# After that, every change is a commit to this repo.
#
# The capability does not register its own cluster, so the hub is registered
# here by ARN (its access entry is in infra: argocd.tf).
apiVersion: v1
kind: Secret
metadata:
  name: delivery-hub
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: delivery-hub
  server: arn:aws:eks:ap-southeast-2:111111111111:cluster/delivery-hub
  project: default
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    # CodeConnections repo URL for this repo (verify the exact format against
    # the EKS "Configure repository access" docs). PLACEHOLDER IDs.
    repoURL: https://codeconnections.ap-southeast-2.amazonaws.com/git-http/111111111111/ap-southeast-2/00000000-0000-0000-0000-000000000000/platform/app-deploy.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: "{clusters/*.yaml,environments/*/app.yaml,environments/*/platform.yaml}"
  destination:
    name: delivery-hub
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
