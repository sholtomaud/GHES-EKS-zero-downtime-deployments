# Fargate's built-in Fluent Bit log router: no sidecars, no DaemonSets, 0 IPs.
# Ships container stdout to the pre-created log group (infra: logging.tf,
# 14-day retention). Pods started before this exists need a restart.
apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  flb_log_cw: "false" # don't ship the router's own logs
  filters.conf: |
    [FILTER]
        Name         parser
        Match        *
        Key_name     log
        Parser       crio
  parsers.conf: |
    [PARSER]
        Name         crio
        Format       Regex
        Regex        ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
  output.conf: |
    [OUTPUT]
        Name              cloudwatch_logs
        Match             kube.*
        region            ap-southeast-2
        log_group_name    /aws/eks/app-nonprod/containers
        log_stream_prefix fargate-
        auto_create_group false
