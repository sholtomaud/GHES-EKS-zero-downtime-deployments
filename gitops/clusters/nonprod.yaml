# Registers the nonprod workload cluster with the managed Argo CD by EKS cluster ARN.
# The capability role reaches it through an EKS access entry (infra: access.tf),
# with no network path or kubeconfig. (verify) Secret shape for the capability.
apiVersion: v1
kind: Secret
metadata:
  name: app-nonprod
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: app-nonprod
  server: arn:aws:eks:ap-southeast-2:333333333333:cluster/app-nonprod
  project: default
