# Registers the prod workload cluster with the managed Argo CD by EKS cluster ARN.
# The capability role reaches it through an EKS access entry (infra: access.tf),
# with no network path or kubeconfig. (verify) Secret shape for the capability.
apiVersion: v1
kind: Secret
metadata:
  name: app-prod
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
stringData:
  name: app-prod
  server: arn:aws:eks:ap-southeast-2:444444444444:cluster/app-prod
  project: default
