# Reusable promotion workflow: the release decision that deploys [DEP-02] [DEP-03].
#
#   GHES Environment approval (who/when/why)
#   -> copy the release by digest Artifactory -> private ECR (internal/* or release/*)
#   -> dev/nonprod/prod: package this environment's desired state as a Helm
#      bundle (deploy/package.sh), store it in Artifactory with build-info, copy
#      it by digest to private ECR internal/deploy/. Managed Argo CD tracks the
#      highest bundle version there and rolls it out. No Git source, no
#      CodeConnections: Argo CD reads only the private ECR copy with IAM.
#   -> ga: customers can now pull release/* from ECR; Artifactory build promoted
#
# Rollback = promote the previous version: a new, higher bundle wrapping it.
#
# Caller (in the app repo, which holds deploy/ copied from this repo):
#   jobs:
#     promote:
#       uses: <org>/<this-repo>/.github/workflows/app-promote.yml@<sha>
#       with: { version: "1.14.0", environment: prod }
#       secrets: inherit
#
# Configuration the caller needs:
#   vars:    JF_URL, JF_OIDC_PROVIDER, ARTIFACTORY_DOCKER_REPO, ARTIFACTORY_HELM_REPO,
#            ARTIFACTORY_RELEASE_META_REPO, ARTIFACTORY_GA_REPO, ARTIFACTORY_EKS_CHARTS_URL
#            (remote of https://aws.github.io/eks-charts), AWS_REGION,
#            ECR_REGISTRY (<acct>.dkr.ecr.<region>.amazonaws.com),
#            AWS_PROMOTE_ROLE_ARN (ghes-promote-internal), AWS_GA_ROLE_ARN (ghes-publish-ga)
#   GHES Environments dev, nonprod, prod, ga with required reviewers on prod and ga.
name: app-promote

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      environment:
        description: dev | nonprod | prod | ga
        type: string
        required: true
      services:
        type: string
        default: '["api","agent","frontend","service-4","service-5","service-6","service-7","service-8"]'
      chart-name:
        type: string
        default: app
      component:
        description: app (the release) | platform (LB controller + log router config)
        type: string
        default: app
      deploy-path:
        description: Directory holding package.sh, charts/ and environments/ (see deploy/ in this repo)
        type: string
        default: deploy
      runner:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read
  id-token: write # OIDC to JFrog and AWS

jobs:
  promote:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }} # approval gate and deployment record
    # One promotion per environment at a time [DEP-06]; Argo CD also serialises syncs.
    concurrency:
      group: app-promote-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.environment }}
      SERVICES: ${{ inputs.services }}
      CHART: ${{ inputs.chart-name }}
      COMPONENT: ${{ inputs.component }}
      JF_URL: ${{ vars.JF_URL }}
      ECR: ${{ vars.ECR_REGISTRY }}
      BUILD_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$TARGET" =~ ^(dev|nonprod|prod|ga)$ ]] || { echo "unknown environment '$TARGET'" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad version '$VERSION'" >&2; exit 1; }
          [[ "$COMPONENT" =~ ^(app|platform)$ ]] || { echo "unknown component '$COMPONENT'" >&2; exit 1; }
          [[ "$COMPONENT" == app || "$TARGET" != ga ]] || { echo "the platform bundle is internal only" >&2; exit 1; }
          if [[ "$TARGET" == ga ]]; then echo "TIER=release" >> "$GITHUB_ENV"; else echo "TIER=internal" >> "$GITHUB_ENV"; fi

      - name: Set up JFrog CLI
        id: jf
        uses: jfrog/setup-jfrog-cli@68c0efdc951dd2359bbbfa15c48bc67b3ae8e4d6 # v5.2.0
        with:
          version: 2.124.0
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          ghe-base-url: ${{ github.api_url }}
          disable-auto-build-publish: true

      - name: AWS credentials (role can only push to its ECR prefix)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ inputs.environment == 'ga' && vars.AWS_GA_ROLE_ARN || vars.AWS_PROMOTE_ROLE_ARN }}
          role-session-name: promote-${{ inputs.environment }}-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Log in to Artifactory (oras, helm)
        env:
          JF_USER: ${{ steps.jf.outputs.oidc-user }}
          JF_TOKEN: ${{ steps.jf.outputs.oidc-token }}
        run: |
          host="${JF_URL#https://}"; host="${host%%/*}"
          echo "JF_HOST=$host" >> "$GITHUB_ENV"
          echo "$JF_TOKEN" | oras login "$host" -u "$JF_USER" --password-stdin
          echo "$JF_TOKEN" | helm registry login "$host" -u "$JF_USER" --password-stdin

      - name: Digest-checked copy helper
        run: |
          # copy <src@digest> <dst:tag> <expected-digest>: idempotent (ECR tags are
          # immutable) and fails if the digest would change. -r brings referrers.
          cat > "$RUNNER_TEMP/copy.sh" <<'SH'
          copy() {
            local have
            have="$(oras manifest fetch --descriptor "$2" 2>/dev/null | jq -r .digest || true)"
            if [[ -n "$have" ]]; then
              [[ "$have" == "$3" ]] || { echo "$2 exists with a different digest ($have)" >&2; exit 1; }
              echo "already present: $2"; return
            fi
            oras cp -r "$1" "$2"
            have="$(oras manifest fetch --descriptor "$2" | jq -r .digest)"
            [[ "$have" == "$3" ]] || { echo "digest changed in copy: $2 ($have != $3)" >&2; exit 1; }
          }
          SH

      - name: Read the digests the chart pins
        if: inputs.component == 'app'
        env:
          HELM_REPO: ${{ vars.ARTIFACTORY_HELM_REPO }}
        run: |
          set -euo pipefail
          helm pull "oci://$JF_HOST/$HELM_REPO/$CHART" --version "$VERSION" -d chart
          tar -xzf "chart/$CHART-$VERSION.tgz" -C chart "$CHART/digests.json"
          cp "chart/$CHART/digests.json" digests.json
          for svc in $(jq -r '.[]' <<<"$SERVICES"); do
            jq -e --arg s "$svc" '.[$s] | startswith("sha256:")' digests.json >/dev/null || { echo "chart has no digest for $svc" >&2; exit 1; }
          done

      # Copy by digest; referrers (signatures, SBOM) come along with -r. ECR tags
      # are immutable, so a re-promotion of the same version is a no-op.
      - name: Copy release Artifactory -> ECR, digests unchanged [REL-01] [REL-02]
        if: inputs.component == 'app'
        env:
          DOCKER_REPO: ${{ vars.ARTIFACTORY_DOCKER_REPO }}
          HELM_REPO: ${{ vars.ARTIFACTORY_HELM_REPO }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/copy.sh"
          for svc in $(jq -r '.[]' <<<"$SERVICES"); do
            d="$(jq -r --arg s "$svc" '.[$s]' digests.json)"
            copy "$JF_HOST/$DOCKER_REPO/$svc@$d" "$ECR/$TIER/$svc:$VERSION" "$d"
          done
          chart_digest="$(oras manifest fetch --descriptor "$JF_HOST/$HELM_REPO/$CHART:$VERSION" | jq -r .digest)"
          copy "$JF_HOST/$HELM_REPO/$CHART@$chart_digest" "$ECR/$TIER/charts/$CHART:$VERSION" "$chart_digest"
          echo "CHART_DIGEST=$chart_digest" >> "$GITHUB_ENV"

      # --- dev / nonprod / prod: the desired state is a Helm bundle -------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.environment != 'ga'

      - name: Package this environment's bundle
        if: inputs.environment != 'ga'
        env:
          HELM_REPO: ${{ vars.ARTIFACTORY_HELM_REPO }}
          EKS_CHARTS_REPO: ${{ vars.ARTIFACTORY_EKS_CHARTS_URL }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        run: |
          set -euo pipefail
          # Strictly increasing, valid semver: Argo CD tracks the highest ("*").
          bundle="1.0.$(date -u +%s)"
          export APP_CHART_REPO="oci://$JF_HOST/$HELM_REPO" OUT="$RUNNER_TEMP/bundles"
          if [[ "$COMPONENT" == app ]]; then
            tgz="$(bash "$DEPLOY_PATH/package.sh" app "$TARGET" "$bundle" "$VERSION")"
          else
            tgz="$(bash "$DEPLOY_PATH/package.sh" platform "$TARGET" "$bundle")"
          fi
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "BUNDLE_TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Store the bundle in Artifactory (system of record, build-info)
        if: inputs.environment != 'ga'
        env:
          HELM_REPO: ${{ vars.ARTIFACTORY_HELM_REPO }}
          META_REPO: ${{ vars.ARTIFACTORY_RELEASE_META_REPO }}
        run: |
          set -euo pipefail
          helm push "$BUNDLE_TGZ" "oci://$JF_HOST/$HELM_REPO/deploy"
          build="$BUILD_NAME-deploy-$COMPONENT-$TARGET"
          jf rt upload "$BUNDLE_TGZ" "$META_REPO/deploy/$COMPONENT-$TARGET/" --build-name="$build" --build-number="$BUNDLE" --flat
          jf rt build-collect-env "$build" "$BUNDLE"
          jf rt build-add-git "$build" "$BUNDLE"
          jf rt build-publish "$build" "$BUNDLE"

      - name: Copy the bundle to private ECR, digest unchanged (Argo CD reads it there)
        if: inputs.environment != 'ga'
        env:
          HELM_REPO: ${{ vars.ARTIFACTORY_HELM_REPO }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/copy.sh"
          src="$JF_HOST/$HELM_REPO/deploy/$COMPONENT-$TARGET"
          d="$(oras manifest fetch --descriptor "$src:$BUNDLE" | jq -r .digest)"
          copy "$src@$d" "$ECR/internal/deploy/$COMPONENT-$TARGET:$BUNDLE" "$d"
          echo "BUNDLE_DIGEST=$d" >> "$GITHUB_ENV"

      # --- ga: customers pull from ECR release/*; mark the build in Artifactory
      - name: Promote the build in Artifactory (GA)
        if: inputs.environment == 'ga'
        env:
          GA_REPO: ${{ vars.ARTIFACTORY_GA_REPO }}
        run: jf rt build-promote "$BUILD_NAME" "$VERSION" "$GA_REPO" --status=ga --copy=true --comment="GA by ${{ github.actor }}"

      - name: Summary
        run: |
          {
            echo "### $COMPONENT $VERSION -> $TARGET"
            [[ -z "${CHART_DIGEST:-}" ]] || echo "Chart: \`$ECR/$TIER/charts/$CHART:$VERSION\` @ \`$CHART_DIGEST\`"
            [[ -z "${BUNDLE:-}" ]] || echo "Bundle: \`$ECR/internal/deploy/$COMPONENT-$TARGET:$BUNDLE\` @ \`$BUNDLE_DIGEST\` (Argo CD picks the highest)"
          } >> "$GITHUB_STEP_SUMMARY"
