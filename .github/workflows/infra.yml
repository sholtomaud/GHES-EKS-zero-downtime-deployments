# Infra CI: build the toolchain image, then typecheck, test (with coverage),
# synthesise and `tofu validate` every stack inside it, then SonarQube.
# No AWS credentials: plan/apply are separate, approval-gated steps (ADR-0005).
#
# On GHES: actions are pinned by SHA and must be available to the instance
# (GitHub Connect or actions-sync). Set the RUNNER_LABEL variable to your
# self-hosted runner label; it falls back to a GitHub-hosted runner here.
name: infra

# Every push to any branch (so a PR's head commit carries the check); no
# separate pull_request trigger, which would run the same job twice.
on:
  push:
    paths:
      - "infra/**"
      - "Containerfile"
      - "Makefile"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs history for new-code detection

      - name: Build toolchain image (Containerfile)
        run: make image

      - name: Toolchain versions
        run: make doctor

      - name: Install locked dependencies
        run: make deps

      - name: Typecheck (TypeScript 7 / tsgo)
        run: make typecheck

      - name: Unit tests with coverage
        run: make coverage

      - name: Synthesise and tofu validate every stack
        run: make validate

      - name: Upload synthesised OpenTofu
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tofu-root-modules
          path: |
            infra/cdktn.out/tofu
            !infra/cdktn.out/tofu/**/.terraform
          if-no-files-found: error

      # SonarQube Server, with the vendor's own action. Skipped until the
      # SONAR_HOST_URL variable and SONAR_TOKEN secret are configured.
      - name: SonarQube scan and quality gate
        if: ${{ vars.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: infra
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
