# SonarQube Server analysis of the infra code (cdktn TypeScript).
# Host and token come from the CI environment (SONAR_HOST_URL, SONAR_TOKEN).
sonar.projectKey=ghes-eks-zero-downtime-infra
sonar.projectName=GHES EKS zero-downtime: infra
sonar.sources=src
sonar.tests=test
sonar.exclusions=src/policies/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
